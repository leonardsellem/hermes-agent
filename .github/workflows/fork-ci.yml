name: Fork targeted tests

# Fork-only check (owner-approved 2026-11-06). The upstream workflows target
# `blacksmith-*` runners that do not exist on this fork, so `ci.yaml` and the
# rest never start here. This job runs the delivering ticket's targeted test
# selection on GitHub-hosted runners for every pull request, so a fork PR can
# carry at least one real check.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: fork-targeted-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  targeted-tests:
    name: Targeted tests (fork)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Install ripgrep (prebuilt binary)
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - name: Set up locked Python and test dependencies
        uses: ./.github/actions/setup-pm
        with:
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web"]'
          test-environment: 'true'
          prune-python-cache: true

      - name: Run the targeted selection
        run: |
          bash scripts/run_tests.sh \
            tests/gateway/test_kanban_result_exit.py \
            tests/gateway/test_managed_worker_route_key.py \
            tests/hermes_cli/test_kanban_worker_admission_wait.py \
            tests/hermes_cli/test_kanban_managed_result_pid.py \
            tests/hermes_cli/test_kanban_managed_exit_reconciliation.py \
            tests/hermes_cli/test_kanban_db.py \
            tests/gateway/test_managed_worker_unknown_status.py \
            tests/agent/test_init_exhausted_pool_billing_error.py \
            -q
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
